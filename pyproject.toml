[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "singularity-operator"
version = "0.5.44"
description = "Ultimate self-improving AI (Singularity Operator): EverythingDB + SelfImprover + Orchestrator + FreeAIClient (Together free-tier) + continuous ROI ranking + deep currency experiment ranking (top_experiment/top_score from CURRENCY_STATUS.md) + ranked experiments by ROI-per-effort + confidence + rank position + priority_score (confidence-weighted) + selection_reason + experiment_count + avg_priority_score + max_priority_score + top_avg_delta + priority_variance + selection_margin + priority_std_dev + priority_median + priority_iqr + priority_range + priority_cv + priority_skewness + priority_kurtosis + priority_entropy + priority_gini + priority_hhi + priority_top_share + priority_effective_n + priority_top_rest_ratio + days_since_signal + next_concrete_step + stale-signal confidence decay. AGA usage/credits visibility."
authors = [{name = "Eric (Mufnluvn)"}]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31.0,<3", "groq>=0.9.0"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
singularity-operator = "singularity_operator:main"

[project.urls]
Homepage = "https://github.com/eric847b/singularity-operator"
Repository = "https://github.com/eric847b/singularity-operator"

[tool.setuptools.packages.find]
where = ["."]
