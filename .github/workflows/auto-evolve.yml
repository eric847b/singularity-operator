name: Auto-Evolve
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: auto-evolve
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install requests
          pip install groq || echo "groq optional"
      - name: Run bounded evolution cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_FULL_PAT: ${{ secrets.GH_FULL_PAT }}
        run: python singularity_operator.py
      - name: Publish evolution report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_FULL_PAT: ${{ secrets.GH_FULL_PAT }}
        run: |
          python - <<'PY'
          import os
          from singularity_operator.github_seamless import GitHubSeamless
          from singularity_operator.orchestrator import SingularityOrchestrator
          orch=SingularityOrchestrator()
          summary=orch.evolution_summary()
          extra={"source":"auto-evolve.yml","run_id":os.getenv("GITHUB_RUN_ID")}
          print("[auto-evolve] evolution report:",GitHubSeamless().publish_evolution_report(summary,extra=extra))
          PY
