name: Auto-Evolve
on: [push, workflow_dispatch]

permissions:
  contents: read
  issues: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install requests
          pip install groq || echo "groq optional"

      - name: Run orchestrated cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_FULL_PAT: ${{ secrets.GH_FULL_PAT }}
        run: |
          python singularity_operator.py || echo "Run with fallbacks."

      - name: Publish evolution report to ROI status issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_FULL_PAT: ${{ secrets.GH_FULL_PAT }}
        run: |
          python - <<'PY'
          import os
          from singularity_operator.github_seamless import GitHubSeamless
          from singularity_operator.orchestrator import SingularityOrchestrator

          orch = SingularityOrchestrator()
          # Lightweight cycle fragment if full run already happened; always publish
          summary = orch.evolution_summary()
          extra = {"source": "auto-evolve.yml", "run_id": os.getenv("GITHUB_RUN_ID")}
          gh = GitHubSeamless()
          result = gh.publish_evolution_report(summary, extra=extra)
          print("[auto-evolve] evolution report:", result)
          PY

      - name: Integration stub
        run: |
          echo "Singularity Operator auto-evolve + evolution report publish complete"
