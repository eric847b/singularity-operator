name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile all Python
        run: python -m compileall -q .
      - name: Verify evolution, provenance, agent, currency-action invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          p = Path('singularity_operator/self_improver.py')
          t = p.read_text()
          ast.parse(t)
          assert 'from .validation import validate_python_evolution' in t
          assert 'validate_python_evolution(' in t

          v = Path('singularity_operator/validation.py').read_text()
          ast.parse(v)
          assert 'def validate_python_evolution' in v

          e = Path('singularity_operator/everything_db.py').read_text()
          ast.parse(e)
          assert 'def export_lineage' in e and 'def walk_ancestors' in e

          a = Path('singularity_operator/agent_proposals.py').read_text()
          ast.parse(a)
          assert 'class AgentProposalWorkflow' in a

          c = Path('singularity_operator/currency_action.py').read_text()
          ast.parse(c)
          assert 'def plan_next_action' in c
          assert 'setup-session-offer' in c
          assert 'AI-Collaboration-Hub' in c

          o = Path('singularity_operator/orchestrator.py').read_text()
          ast.parse(o)
          assert 'currency_next_action' in o
          assert 'plan_next_action' in o
          assert 'eric847b/AI-Collaboration-Hub' in o
          assert 'parent_key=self.last_currency_key' in o

          print('All invariants verified')
          PY
      - name: Run tests when present
        shell: bash
        run: |
          if find . -maxdepth 3 -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            pytest -q
          else
            echo 'No pytest suite present; compile and invariant gates passed.'
          fi
