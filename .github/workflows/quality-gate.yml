name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile all Python
        run: python -m compileall -q .
      - name: Verify evolution safety and provenance invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          # SelfImprover must use shared validation
          p = Path('singularity_operator/self_improver.py')
          t = p.read_text()
          ast.parse(t)
          assert 'from .validation import validate_python_evolution' in t
          assert 'validate_python_evolution(' in t

          # validation module must expose core helpers
          v = Path('singularity_operator/validation.py').read_text()
          ast.parse(v)
          assert 'def validate_python_evolution' in v
          assert 'def ast_equivalent' in v

          # EverythingDB provenance columns + APIs
          e = Path('singularity_operator/everything_db.py').read_text()
          ast.parse(e)
          assert 'parent_key' in e
          assert 'derives_from' in e
          assert 'def get_children' in e
          assert 'def get_sequence' in e

          # Orchestrator improvement accounting + currency parent link
          o = Path('singularity_operator/orchestrator.py').read_text()
          ast.parse(o)
          assert 'actual = self.improver.improvements_made - before' in o
          assert 'self.metrics["improvements"] += actual' in o
          assert 'parent_key=self.last_currency_key' in o

          print('Evolution safety + provenance invariants verified')
          PY
      - name: Run tests when present
        shell: bash
        run: |
          if find . -maxdepth 3 -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            pytest -q
          else
            echo 'No pytest suite present; compile and invariant gates passed.'
          fi
