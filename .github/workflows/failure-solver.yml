name: Proactive Failure Solver
on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Auto-Evolve"]
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  solve:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests
      - name: Run FailureSolver v3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_FULL_PAT: ${{ secrets.GH_FULL_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python .github/run_failure_solver.py || true
