name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (e.g. v0.5.19)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Verify release version and source tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v="$(tr -d '[:space:]' < VERSION)"
          test -n "$v"
          python - "$v" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          checks = {
              "pyproject.toml": r'^version\s*=\s*"([^"]+)"',
              "singularity_operator/__init__.py": r'^__version__\s*=\s*"([^"]+)"',
              "README.md": r'^# Singularity Operator v([^\s]+)',
          }
          for filename, pattern in checks.items():
              text = pathlib.Path(filename).read_text(encoding="utf-8")
              match = re.search(pattern, text, re.MULTILINE)
              actual = match.group(1) if match else ""
              if actual != version:
                  raise SystemExit(f"Version mismatch: VERSION={version}, {filename}={actual or 'missing'}")
          PY
          tag="${INPUT_TAG:-$REF_TAG}"
          test "$tag" = "v$v"
          test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          echo "Verified version $v at tag $tag"

  build-windows:
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Windows executables
        shell: bash
        run: |
          set -euo pipefail
          pyinstaller --onefile --console --name singularity-operator --clean \
            --hidden-import=singularity_operator \
            --collect-submodules=singularity_operator \
            singularity_operator.py
          test -s dist/singularity-operator.exe
          if [ -f groq_singularity.py ]; then
            pyinstaller --onefile --console --name singularity-groq --clean \
              --hidden-import=singularity_operator \
              --collect-submodules=singularity_operator \
              groq_singularity.py
          fi
          ls -lah dist/
      - uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          path: dist/*.exe
          if-no-files-found: error

  build-sdist:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and validate Python packages
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build
          compgen -G 'dist/*.whl' >/dev/null
          compgen -G 'dist/*.tar.gz' >/dev/null
          ls -lah dist/
      - uses: actions/upload-artifact@v7
        with:
          name: python-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [verify-version, build-windows, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true
      - name: Validate assets and generate SHA-256 manifest
        run: |
          set -euo pipefail
          test -s release-assets/singularity-operator.exe
          compgen -G 'release-assets/*.whl' >/dev/null
          compgen -G 'release-assets/*.tar.gz' >/dev/null
          cd release-assets
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS
      - name: Determine tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Singularity Operator ${{ steps.tag.outputs.tag }}
          body: |
            ## Singularity Operator ${{ steps.tag.outputs.tag }}

            Self-improving AI system with EverythingDB, fleet orchestration, and continuous ROI ranking.

            ### Assets and integrity
            - Windows executable and Python wheel/sdist are attached below.
            - `SHA256SUMS` contains SHA-256 digests for every release asset; verify downloads with `sha256sum -c SHA256SUMS`.

            See README for setup and architecture.
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
